name: Deploy published image to local runner

on:
  workflow_run:
    workflows:
      - Build and publish Docker image
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Initialize verification artifact
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'meal-deploy-observation'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $dir 'summary.md'), '# Zero-Downtime Redeployment Verification' + "`n`nDeployment did not reach the monitoring step; inspect the earlier job step for the failure." + "`n", $utf8)

      - name: Check out the image source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Monitor, canary, deploy, and summarize
        id: deploy
        shell: powershell
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/meal-app
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          APP_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          & "$env:GITHUB_WORKSPACE\.github\workflows\deploy.ps1"

      - name: Publish verification summary
        if: always()
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'meal-deploy-observation\summary.md'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          if (Test-Path $path) {
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8) + "`n", $utf8)
          } else {
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, '# Zero-Downtime Redeployment Verification' + "`n`nNo report file was produced; inspect the job logs." + "`n", $utf8)
          }

      - name: Upload UTF-8 request log and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-deploy-verification-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/meal-deploy-observation
          if-no-files-found: warn
          retention-days: 30
